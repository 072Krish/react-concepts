<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Using HTML </title>
</head>
<body>
    <h1> Registration Form (Aagaz 2K25)</h1>
    <hr/>
    <form action="/action.php">

       <label for="username">Username:</label><br />
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        required
        maxlength="30"
      /><br /><br />

      <label for="useremail">Email:</label><br />
      <input
        type="email"
        id="useremail"
        name="useremail"
        placeholder="example@example.com"
        required
      /><br /><br />

      <label for="userpassword">Password:</label><br />
      <input
        type="password"
        id="userpassword"
        name="userpassword"
        placeholder="Create a password"
        required
        minlength="8"
      /><br /><br /><hr />

        <H2> Select Your Class </H2>
<label for="101">
        <input type="radio" value="Class X" name="class" id="101">Class X
</label>
<br>
<label for="102">
        <input type="radio" value="Class XI" name="class" id="102">Class XI
        </label>
        <br>
<label for="103">
        <input type="radio" value="Class XII" name="class" id="102">Class XII
        </label>
        <br>
        <hr/>
        <h2> Select Your Subjects</h2>
            <label for="math">
                <input type="checkbox" value="Maths" name="subject" id="101">Maths</label><br>
            <label for="phy">
                <input type="checkbox" value="Physics" name="subject" id="102">Physics</label><br>
            <label for="chem">
                <input type="checkbox" value="Chemistry" name="subject" id="103">Chemistry</label><br>
            <label for="eng">
                <input type="checkbox" value="English" name="subject" id="104">English</label><br>
            <label for="hindi">
                <input type="checkbox" value="Hindi" name="subject" id="105">Hindi</label><br>               
 <br>
 <hr />
        <h2> Please Select Your City</h2>
        <select name="city">
            <option value="Delhi">Delhi</option>
            <option value="Delhi">Noida</option>
            <option value="Delhi">Gurugram</option>
            <option value="Delhi">Jind</option>
            <option value="Delhi">Karnal</option>
        </select><br><hr />

        <label for="age">Age:</label><br />
      <input
        type="number"
        id="age"
        min="1"
        max="120"
        placeholder="Enter your age"
        required
      /><br /><br />

      <label for="appointment">Preferred Appointment Date & Time:</label><br />
      <input
        type="datetime-local"
        id="appointment"
        name="appointment"
        required
      /><br /><br />
                <textarea name="feedback" id="101" placeholder="Please give your valuable feedback here" rows="3"> Feedback </textarea><br><hr />
                <input type="submit" value="Submit">
                <hr />
        </form>
   </body>
</html>
